<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CPBC App</title>
<meta name="theme-color" content="#1a3a6b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CPBC App">
<style>
  :root{
    --gold:#c9a84c;
    --gold2:#e8c96a;
    --gold3:#8a6a1f;
    --deep:#0b1528;
    --navy:#1a3a6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--deep);overflow:hidden}
  #appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--deep)}

  /* ---------- splash / loader ---------- */
  #splash{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(circle at 50% 42%, #112044 0%, #0b1528 70%);
    transition:opacity .5s ease, visibility .5s ease;
  }
  #splash.hide{opacity:0;visibility:hidden}

  .logo-wrap{
    position:relative;width:200px;height:200px;
    display:flex;align-items:center;justify-content:center;
  }
  .logo-wrap img{
    width:128px;height:128px;border-radius:50%;
    box-shadow:0 0 32px rgba(201,168,76,.35);
    position:relative;z-index:2;
    background:#fff;
    padding:6px;
  }

  /* Three golden rings at different speeds */
  .ring{position:absolute;border-radius:50%;border:2.5px solid transparent;}
  .r1{
    width:200px;height:200px;
    border-top-color:var(--gold);border-right-color:var(--gold);
    animation:spin 1.6s linear infinite;
    filter:drop-shadow(0 0 7px rgba(201,168,76,.7));
  }
  .r2{
    width:160px;height:160px;
    border-bottom-color:var(--gold2);border-left-color:var(--gold2);
    animation:spin 2.3s linear infinite reverse;
    filter:drop-shadow(0 0 5px rgba(232,201,106,.6));
  }
  .r3{
    width:118px;height:118px;
    border-top-color:var(--gold3);border-left-color:var(--gold3);
    animation:spin 1.1s linear infinite;
    filter:drop-shadow(0 0 4px rgba(138,106,31,.6));
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .brand{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#e8eef8;font-weight:700;font-size:19px;letter-spacing:1.5px;
    text-align:center;
    text-shadow:0 0 20px rgba(201,168,76,.35);
  }
  .brand span{color:var(--gold)}
  .tagline{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#7a90b8;font-size:11.5px;letter-spacing:3px;
    text-transform:uppercase;margin-top:-12px;text-align:center;
  }

  .retry{margin-top:6px;display:none;font-family:-apple-system,sans-serif;text-align:center}
  .retry a{color:var(--gold);font-size:13px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
  <iframe
    id="appFrame"
    title="CPBC App"
    allow="camera; clipboard-write; clipboard-read">
  </iframe>

  <div id="splash">
    <div class="logo-wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <img src="icon.png" alt="Convention of Philippine Baptist Churches">
    </div>
    <div class="brand">Convention of <span>Philippine Baptist</span><br>Churches Inc.</div>
    <div class="tagline">Loading</div>
    <div class="retry" id="retry">
      <a id="retryLink">Taking too long? Tap to retry</a>
    </div>
  </div>

<script>
  // ---- Hardcoded Apps Script web app URL ----
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxunajBiwJDNqKuZVmXLsXYsCIngSYgfyr6uas1-sGjdxlk8IwwkIWNDJ2Pquz0BJlTuw/exec';

  var frame  = document.getElementById('appFrame');
  var splash = document.getElementById('splash');
  var retry  = document.getElementById('retry');
  var hidden = false;

  function hideSplash(){ if(hidden) return; hidden = true; splash.classList.add('hide'); }

  // Hide splash once embedded app has loaded
  frame.addEventListener('load', function(){ setTimeout(hideSplash, 350); });

  // Safety net: show retry link if not loaded in 15s
  setTimeout(function(){ if(!hidden) retry.style.display = 'block'; }, 15000);
  document.getElementById('retryLink').addEventListener('click', function(){
    retry.style.display = 'none';
    frame.src = APP_URL + (APP_URL.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now();
  });

  // Kick off loading the Apps Script app
  frame.src = APP_URL;

  // ---- PWA: register service worker (app shell only) ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
